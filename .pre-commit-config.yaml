repos:
  # Basic repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Markdown formatting
  - repo: local
    hooks:
      - id: prettier-markdown
        name: prettier (markdown)
        entry: prettier
        args: ["--write", "--list-different"]
        types: [markdown]
        language: node
        additional_dependencies:
          - "prettier@3.6.2"

  # Markdown linting and auto-fixing
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2-docker
        args:
          - "--config"
          - ".markdownlint-cli2.yaml"
          - "--fix"

  # Copyright header: automatically inserts LICENSE-HEADER.txt as a `#`
  # comment block at the top of every Python file that doesn't already
  # have it (existing headers are left untouched). This runs BEFORE ruff
  # so a freshly inserted header is present when ruff checks/formats the
  # file, rather than needing a second commit.
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: insert-license (python)
        files: \.py$
        args:
          - --license-filepath=LICENSE-HEADER.txt
          - --comment-style=#
          - --use-current-year

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
