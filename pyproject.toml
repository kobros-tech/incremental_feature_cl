[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-feature-cl"
version = "0.3.0"
description = "Binary classifier with zero-initialised incremental feature expansion and replay (scikit-learn compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kobros-Tech Ltd" }]
keywords = ["scikit-learn", "binary-classification", "incremental-learning", "feature-expansion"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
